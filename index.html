<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b29"><title>13th Age — Console MJ</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf5;background:#101521}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:16px}header,.bar,.line,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:1.45rem;margin:0}h2{font-size:1.1rem;margin:10px 0}small,.muted{color:#a9b6c9}.panel,.fighter{background:#1c2636;border:1px solid #344156;border-radius:12px;padding:12px;margin:10px 0}.fighter.active{border-color:#e2b35a;background:#283143}.fighter.dead{opacity:.48}.fighter .line{flex-wrap:nowrap}.name{flex:1;min-width:0;font-weight:650}.hp{min-width:92px;text-align:right}input,select,textarea,button{font:inherit;color:inherit;border-radius:8px;border:1px solid #4b5b70;background:#101a2a;padding:10px}input[type=number]{width:80px}input[type=checkbox]{width:20px;height:20px}textarea{width:100%;min-height:110px}button{background:#304665;cursor:pointer}button.primary{background:#426fbb;border-color:#6489c8}button:disabled{opacity:.4;cursor:default}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.tabs button.selected{background:#426fbb}.hidden{display:none!important}.meter{height:6px;background:#3a4554;border-radius:5px;margin-top:8px;overflow:hidden}.meter>div{height:100%;background:#58ad85}.stat{font-size:1.2rem;font-weight:700}.field{display:flex;flex-direction:column;gap:5px}.field input{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.add{margin-top:15px}label{font-size:.92rem}.chip{background:#2e415d;border-radius:7px;padding:5px 9px} .danger{background:#713c45} .full{width:100%} .tiny{font-size:.8rem} .rowgap{margin-top:10px} .narrow{width:72px!important} .switch{display:flex;align-items:center;gap:8px} .encounter{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .encounter strong{flex:1} .note{border-left:3px solid #e2b35a;padding-left:10px} @media(max-width:530px){main{padding:10px}.fighter{padding:9px}.hp{min-width:72px;font-size:.86rem}.name{font-size:.94rem}.tabs button{padding:10px 4px}button{padding:9px}input[type=number]{width:64px}}
</style></head><body><main><header><div><h1>⚔️ 13th Age — Console MJ</h1><small>Combats rapides • sauvegarde sur cet appareil</small></div><button id="export">Exporter JSON</button></header><nav class="tabs"><button data-tab="combat" class="selected">Combat</button><button data-tab="prep">Préparation</button><button data-tab="library">Rencontres</button></nav><section id="combat"></section><section id="prep" class="hidden"></section><section id="library" class="hidden"></section><input type="file" id="file" accept="application/json,.json" class="hidden"></main><script>
'use strict';const KEY='age13-tracker-v1';let data;const fresh=()=>({version:1,players:Array.from({length:7},(_,i)=>({id:'p'+i,name:'Joueur '+(i+1),present:i<6,init:null})),encounters:[{id:'demo',name:'Embuscade gobeline',notes:'Le chef orque porte une clé.',round:1,active:null,escalationOverride:null,monsters:[{id:'m1',name:'Chef orque',type:'monster',init:19,max:90,hp:90},{id:'m2',name:'Ogre',type:'monster',init:13,max:75,hp:75},{id:'m3',name:'Gobelins',type:'mook',init:15,each:7,max:56,hp:56}]}],current:'demo'});function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.players)&&Array.isArray(x.encounters))return x}catch{}return fresh()}data=load();let tab='combat';const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const enc=()=>data.encounters.find(x=>x.id===data.current)||data.encounters[0];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('La sauvegarde locale a échoué. Exporte tes données.')}};const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const num=(v,f=0)=>v===''||v==null?f:Number(v);function order(e){return [...data.players.filter(p=>p.present).map(p=>({...p,type:'player'})),...e.monsters.filter(m=>m.hp>0)].sort((a,b)=>(b.init??-999)-(a.init??-999)||String(a.id).localeCompare(String(b.id)))}function normalizeActive(e){const arr=order(e);if(!arr.length)e.active=null;else if(!arr.some(x=>x.id===e.active))e.active=arr[0].id}function changeTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b.dataset.tab===t));['combat','prep','library'].forEach(x=>$(x).classList.toggle('hidden',x!==t));render()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));function render(){const e=enc();if(!e){$('combat').innerHTML='<p>Crée une rencontre pour commencer.</p>';$('prep').innerHTML='';renderLibrary();return}normalizeActive(e);renderCombat(e);renderPrep(e);renderLibrary();save()}
function renderCombat(e){const arr=order(e),esc=e.escalationOverride??Math.min(6,Math.max(0,e.round-1));$('combat').innerHTML=`<div class="panel"><div class="bar"><div><strong>${escape(e.name)}</strong><div class="muted tiny">${data.players.filter(p=>p.present).length} joueurs présents</div></div><div><span class="chip">Round <b>${e.round}</b></span> <span class="chip">Escalade +<b>${esc}</b></span></div></div><div class="actions rowgap"><button data-action="prev">← Tour précédent</button><button class="primary" data-action="next">Combattant suivant →</button><button data-action="roundminus">Round −</button><button data-action="roundplus">Round +</button><button data-action="escalation">Escalade ±</button></div></div><h2>Initiatives <small>(modifiables ici)</small></h2>${arr.map(u=>fighter(u,e)).join('')}${e.monsters.filter(m=>m.hp===0).map(u=>fighter(u,e,true)).join('')}<div class="panel"><h2>PV des monstres</h2><div class="grid"><label class="field">Cible<select id="target">${e.monsters.map(m=>`<option value="${escape(m.id)}">${escape(m.name)}</option>`).join('')}</select></label><label class="field">Quantité<input id="amount" type="number" min="0" value="7"></label></div><div class="actions rowgap"><button data-action="heal">+ Soigner</button><button class="primary" data-action="damage">− Dégâts</button><button data-action="undo">↶ Annuler dernier dégât</button></div><p class="muted tiny">Les mooks utilisent une réserve de PV commune. Les morts sont ignorés automatiquement.</p></div>`;if(e.target&&e.monsters.some(m=>m.id===e.target))$('target').value=e.target;else e.target=e.monsters[0]?.id||null;$('target')?.addEventListener('change',ev=>{e.target=ev.target.value;save()});$('combat').querySelectorAll('[data-init]').forEach(el=>{el.addEventListener('change',ev=>{const id=el.dataset.init;const u=[...data.players,...e.monsters].find(x=>x.id===id);if(u){u.init=ev.target.value===''?null:num(ev.target.value);render()}})});$('combat').querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action));}
function fighter(u,e,dead=false){const isPlayer=u.type==='player',mooks=u.type==='mook';return `<div class="fighter ${u.id===e.active?'active':''} ${dead?'dead':''}"><div class="line"><label class="field tiny">INIT<input class="narrow" type="number" data-init="${escape(u.id)}" value="${u.init??''}" placeholder="—"></label><div class="name">${u.id===e.active?'▶ ':''}${dead?'☠ ':''}${escape(u.name)}${mooks?`<div class="muted tiny">${Math.ceil(u.hp/u.each)} mooks vivants • ${u.each} PV chacun</div>`:''}</div><div class="hp">${isPlayer?'<span class="muted">Joueur</span>':`<b>${u.hp}/${u.max}</b> PV`}</div></div>${!isPlayer?`<div class="meter"><div style="width:${Math.max(0,100*u.hp/u.max)}%"></div></div>`:''}</div>`}
function act(a){const e=enc(),arr=order(e);if(a==='next'||a==='prev'){if(!arr.length)return;const idx=arr.findIndex(x=>x.id===e.active);if(a==='next'){if(idx>=arr.length-1){e.round++;e.active=arr[0].id}else e.active=arr[Math.max(0,idx+1)].id}else{if(idx<=0){e.round=Math.max(1,e.round-1);e.active=arr[arr.length-1].id}else e.active=arr[idx-1].id}}else if(a==='roundplus')e.round++;else if(a==='roundminus')e.round=Math.max(1,e.round-1);else if(a==='escalation'){const n=e.escalationOverride??Math.min(6,e.round-1);e.escalationOverride=(n+1)%7}else if(a==='damage'||a==='heal'){const id=$('target')?.value,m=e.monsters.find(x=>x.id===id),amt=Math.max(0,num($('amount')?.value));if(!m)return;e.lastHp={id:m.id,hp:m.hp};m.hp=Math.max(0,Math.min(m.max,m.hp+(a==='heal'?amt:-amt)));e.target=id}else if(a==='undo'){const x=e.lastHp;if(x){const m=e.monsters.find(m=>m.id===x.id);if(m)m.hp=x.hp;e.lastHp=null}}render()}
function renderPrep(e){$('prep').innerHTML=`<div class="panel"><h2>Rencontre</h2><label class="field">Nom<input id="encname" value="${escape(e.name)}"></label><label class="field rowgap">Notes secrètes<textarea id="notes">${escape(e.notes||'')}</textarea></label></div><div class="panel"><h2>Joueurs (jusqu'à 7)</h2>${data.players.map(p=>`<div class="line rowgap"><label class="switch"><input type="checkbox" data-present="${p.id}" ${p.present?'checked':''}> Présent</label><input style="flex:1;min-width:80px" data-playername="${p.id}" value="${escape(p.name)}"><input type="number" data-playerinit="${p.id}" placeholder="Init" value="${p.init??''}"></div>`).join('')}</div><div class="panel"><h2>Monstres</h2>${e.monsters.map(m=>`<div class="fighter"><div class="bar"><strong>${escape(m.name)} ${m.type==='mook'?'(mooks)':''}</strong><button class="danger" data-remove="${m.id}">Supprimer</button></div><div class="grid rowgap"><label class="field">Initiative<input type="number" data-moninit="${m.id}" value="${m.init??''}"></label><label class="field">PV maximum<input type="number" min="1" data-max="${m.id}" value="${m.max}"></label>${m.type==='mook'?`<label class="field">PV par mook<input type="number" min="1" data-each="${m.id}" value="${m.each}"></label>`:''}</div></div>`).join('')}<h2>Ajouter un ennemi</h2><div class="grid"><label class="field">Nom<input id="newname" placeholder="Ex. Gobelins"></label><label class="field">Type<select id="newtype"><option value="monster">Monstre individuel</option><option value="mook">Groupe de mooks</option></select></label><label class="field">Initiative<input id="newinit" type="number" value="10"></label><label class="field">PV (ou PV par mook)<input id="newhp" type="number" min="1" value="7"></label><label class="field">Nombre de mooks<input id="newcount" type="number" min="1" value="5"></label></div><button class="primary full rowgap" id="addmonster">+ Ajouter</button></div>`;function attach(sel,fn){$('prep').querySelectorAll(sel).forEach(el=>el.addEventListener('change',ev=>{fn(el,ev);render()}))}attach('[data-present]',el=>{data.players.find(p=>p.id===el.dataset.present).present=el.checked});attach('[data-playername]',el=>{data.players.find(p=>p.id===el.dataset.playername).name=el.value});attach('[data-playerinit]',el=>{data.players.find(p=>p.id===el.dataset.playerinit).init=el.value===''?null:num(el.value)});attach('[data-moninit]',el=>{e.monsters.find(m=>m.id===el.dataset.moninit).init=el.value===''?null:num(el.value)});attach('[data-max]',el=>{const m=e.monsters.find(m=>m.id===el.dataset.max);m.max=Math.max(1,num(el.value,1));m.hp=Math.min(m.hp,m.max)});attach('[data-each]',el=>{const m=e.monsters.find(m=>m.id===el.dataset.each);m.each=Math.max(1,num(el.value,1))});$('encname').addEventListener('change',ev=>{e.name=ev.target.value||'Rencontre';render()});$('notes').addEventListener('change',ev=>{e.notes=ev.target.value;save()});$('prep').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce monstre ?')){e.monsters=e.monsters.filter(m=>m.id!==b.dataset.remove);render()}});$('addmonster').onclick=()=>{const name=$('newname').value.trim(),type=$('newtype').value,each=Math.max(1,num($('newhp').value,1)),count=Math.max(1,num($('newcount').value,1));if(!name)return alert('Entre le nom du monstre.');const max=type==='mook'?each*count:each;e.monsters.push({id:uid(),name,type,init:$('newinit').value===''?null:num($('newinit').value),max,hp:max,...(type==='mook'?{each}:{})});render()}}
function renderLibrary(){$('library').innerHTML=`<div class="panel"><h2>Mes rencontres</h2>${data.encounters.map(e=>`<div class="encounter rowgap"><strong>${escape(e.name)} ${e.id===data.current?'✓':''}</strong><button data-open="${e.id}">Ouvrir</button><button data-copy="${e.id}">Dupliquer</button><button class="danger" data-delete="${e.id}">✕</button></div>`).join('')}<button class="primary full rowgap" id="newenc">+ Nouvelle rencontre</button></div><div class="panel"><h2>Transférer sur un autre appareil</h2><p class="muted">Exporte un fichier JSON sur ton ordinateur, puis importe-le sur ton Android. L'importation remplace les rencontres et joueurs présents sur cet appareil.</p><div class="actions"><button id="export2">Exporter mes données</button><button id="import">Importer un fichier</button></div><p class="note tiny">La sauvegarde locale dépend du navigateur. Conserve une copie exportée avant une partie importante.</p></div>`;$('library').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{data.current=b.dataset.open;changeTab('combat')});$('library').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const old=data.encounters.find(e=>e.id===b.dataset.copy),copy=JSON.parse(JSON.stringify(old));copy.id=uid();copy.name+=' (copie)';copy.round=1;copy.active=null;copy.lastHp=null;data.encounters.push(copy);data.current=copy.id;changeTab('prep')});$('library').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(data.encounters.length===1)return alert('Conserve au moins une rencontre.');if(confirm('Supprimer définitivement cette rencontre ?')){data.encounters=data.encounters.filter(e=>e.id!==b.dataset.delete);if(data.current===b.dataset.delete)data.current=data.encounters[0].id;render()}});$('newenc').onclick=()=>{const x={id:uid(),name:'Nouvelle rencontre',notes:'',round:1,active:null,escalationOverride:null,monsters:[]};data.encounters.push(x);data.current=x.id;changeTab('prep')};$('export2').onclick=exportData;$('import').onclick=()=>$('file').click()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='13th-age-rencontres.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=exportData;$('file').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.version!==1||!Array.isArray(x.players)||!Array.isArray(x.encounters)||!x.encounters.length||x.players.length>100||x.encounters.length>1000||!x.encounters.every(e=>Array.isArray(e.monsters)))throw Error('Format invalide');if(!confirm('Remplacer les rencontres enregistrées sur cet appareil par celles du fichier ?'))return;data=x;data.current=data.encounters.some(e=>e.id===data.current)?data.current:data.encounters[0].id;save();changeTab('library')}catch(err){alert('Impossible d’importer : '+err.message)}finally{ev.target.value=''}};render();
</script></body></html>
